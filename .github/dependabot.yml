version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ci-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: [ci]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        patterns: ["*"]
    commit-message:
      prefix: chore
    labels: [chore]
    open-pull-requests-limit: 5

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit-hooks:
        patterns: ["*"]
    commit-message:
      prefix: chore
    labels: [chore]
    open-pull-requests-limit: 5
