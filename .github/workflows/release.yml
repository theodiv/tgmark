name: Package Publishing

on:
  push:
    tags: [v*]
  workflow_dispatch:  # from main: X.Y.Z.devN to TestPyPI, no tag, no release

permissions:
  contents: read

cache-mode: none

jobs:
  check:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # check-release.sh compares HEAD with origin/main
          persist-credentials: false

      - name: Check version and branch
        id: version
        run: scripts/check-release.sh

      - name: Extract release notes
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-notes.sh "$VERSION" > release-notes.md

      - name: Upload release notes
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  ci:
    name: Run continuous integration
    uses: $/.github/workflows/ci.yml

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [check, ci]
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Set development version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: sed -i "s/^__version__ = \".*\"$/__version__ = \"$VERSION\"/" src/tgmark/__init__.py

      - name: Point docs links at the tag
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: sed -i -E "s#(github\.com/$GITHUB_REPOSITORY/(blob|tree))/main/docs#\1/v$VERSION/docs#gI" README.md pyproject.toml

      - name: Create virtual environment
        run: python -m venv --upgrade-deps .venv

      - name: Install release dependencies
        run: .venv/bin/pip install --group release

      - name: Build sdist and wheel
        run: .venv/bin/python -m build

      - name: Check distributions
        run: .venv/bin/twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to ${{ github.event_name == 'push' && 'PyPI' || 'TestPyPI' }}
    runs-on: ubuntu-latest
    needs: package
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'push' && 'PyPI' || 'TestPyPI' }}
      url: ${{ github.event_name == 'push' && 'https://pypi.org/p/tgmark' || 'https://test.pypi.org/p/tgmark' }}
    permissions:
      id-token: write  # trusted publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: ${{ github.event_name == 'push' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [check, pypi]
    if: github.event_name == 'push'
    timeout-minutes: 5
    permissions:
      contents: write  # gh release create

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            --prerelease="$PRERELEASE"
