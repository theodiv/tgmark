repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: local
    hooks:
      - id: ruff-check
        name: lint python with ruff
        entry: .venv/bin/ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: format python with ruff
        entry: .venv/bin/ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: check types with mypy
        entry: .venv/bin/mypy src/ tests/
        language: system
        types: [python]
        pass_filenames: false
      - id: zizmor
        name: check workflows with zizmor
        entry: .venv/bin/zizmor --offline .github/
        language: system
        files: ^\.github/
        types: [yaml]
        pass_filenames: false
